  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="时间尺">
  <!-- P33 感知缓解（v66）：冷孵化进程的 ~1.4s+ 黑屏换成品牌启动图。只做 SE 尺寸
       （唯一真实设备），其它设备保持系统默认；iOS 只认静态图，动图不存在于此机制。 -->
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-750x1334.png">
  <meta name="theme-color" content="#0e0f13" id="meta-theme-color">
  <script>
    (() => {
      try {
        const enabled = new URLSearchParams(location.hash.slice(1)).get('boottrace') === '1';
        if (enabled) {
          window.__timelogBootTrace = {
            marks: [{ name: 'html_inline_start', at: performance.now() }],
            snapshot: 'pending',
            snapshotStates: ['pending']
          };
        }
      } catch {}
      try {
        const pref = localStorage.getItem('timelog.theme') || 'auto';
        if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
        // Resolve theme-color before paint so light-mode reloads don't flash a dark
        // status bar (the meta default is dark; applyTheme only runs after the module
        // loads). auto follows the system preference.
        const effective = pref === 'auto'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        const meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', effective === 'light' ? '#eceef3' : '#0e0f13');
      } catch {}
    })();
  </script>
  <script>
    (() => {
      try {
        const d = JSON.parse(localStorage.getItem('timelog.v1'));
        document.documentElement.setAttribute('data-boot', (d && d.entries && d.entries.length) ? 'has-entries' : 'empty');
      } catch { document.documentElement.setAttribute('data-boot', 'empty'); }
    })();
  </script>
  <script>
    // v58 Fix A：尽早注册 Service Worker，脱离 ES module 图的加载链路。
    // app.js 末尾原注册在慢启动时要等整张 12模块图跑完才到达；register 幂等，
    // app.js 仍负责 updatefound/更新提示，此处只保证注册尽早发生。
    (() => {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
      } catch {}
    })();
  </script>

<script>
  (() => {
    // SPEC-013：静态壳 i18n 引导。**必须同步、必须在 ES module 之前**——启动门闩只压
    // #add-btn/.ruler/.tl-head/#timeline/.usage-day，header 站点名与「天/周/月/年」在
    // 模块到达前就已可见，等模块再填会让非中文用户首访闪一帧中文。
    // 这份字典与 src/locales/zh.js 重复，漂移由 project_audit.py 的
    // audit_shell_dict_matches_catalog 逐条比对拦住，不靠人记得同步。
    const SUPPORTED = ['zh', 'en'];
    const SHELL = {
      zh: {

        "chrome.fabLogAria": "记一条新的时间记录",
        "list.titleDay": "当日时间轴",
        "period.backDay": "回到今天",

        "shell.gotIt": "知道了",

        "shell.moreAria": "打开更多菜单",

        "shell.nextAria": "下一段",
        "shell.nextTip": "切到下一段。",
        "shell.openNew": "打开新地址",
        "shell.openNewAria": "打开新地址 time.eigentime.org",
        "shell.prevAria": "上一段",
        "shell.prevTip": "切到上一段。",
        "shell.repoAria": "时间尺 GitHub 仓库",
        "shell.title": "时间尺",
        "shell.todayTip": "回到包含今天的当前周期。",
        "shell.undo": "撤销",
        "shell.updateBtn": "更新应用",
        "shell.updateFound": "发现新版。当前数据仍保存在本机。",
        "shell.updateStuck": "没生效？完全退出应用（Safari 关闭本站全部标签页）后重新打开即可完成更新，数据不受影响。",
        "shell.updateTip": "刷新并加载新版应用。",
        "shell.viewDayAria": "天视图",
        "shell.viewDayTip": "查看单日时间轴，可编辑记录。",
        "shell.viewMonthAria": "月视图",
        "shell.viewMonthTip": "查看本月每日汇总，可下钻到某天。",
        "shell.viewWeekAria": "周视图",
        "shell.viewWeekTip": "查看本周每日汇总，可下钻到某天。",
        "shell.viewYearAria": "年视图",
        "shell.viewYearTip": "查看全年每月汇总，可下钻到某月。",
        "shell.viewsAria": "视图",
        "toast.deleted": "已删除"
      },
      en: {
        "chrome.fabLog": "＋ Log it",
        "chrome.fabLogAria": "Log a new time entry",
        "list.titleDay": "Timeline",
        "period.backDay": "Today",
        "period.day": "Day",

      const pref = String(stored || '').trim();
      if (SUPPORTED.indexOf(pref) >= 0) return pref;
      for (const raw of (langs || [])) {
        const tag = String(raw || '').toLowerCase();
        const hit = SUPPORTED.find(code => tag === code || tag.indexOf(code + '-') === 0);
        if (hit) return hit;
      }
      return 'zh';
    };
    let locale = 'zh';
    try { locale = resolve(localStorage.getItem('timelog.locale'), navigator.languages); } catch {}
    window.__timelogLocale = locale;
    document.documentElement.lang = locale;
    const dict = SHELL[locale] || SHELL.zh;
    const put = (attr, apply) => {
      document.querySelectorAll('[' + attr + ']').forEach(el => {
        const value = dict[el.getAttribute(attr)];
        if (typeof value === 'string') apply(el, value);
      });
    };
    put('data-i18n', (el, v) => { el.textContent = v; });
    put('data-i18n-aria', (el, v) => { el.setAttribute('aria-label', v); });
    put('data-i18n-tip', (el, v) => { el.setAttribute('data-tip', v); });
    put('data-i18n-alt', (el, v) => { el.setAttribute('alt', v); });
  })();

<script>
  (() => {
    // Safari 刷新时会先绘制静态 HTML 壳，再等待 ES module 恢复真实内容，造成一帧
    // 「主内容消失 / 回到今天误出现」。同标签页只保存已安全渲染的 DOM 快照，在模块
    // 到达前接住上一帧；sessionStorage 不跨标签、不上传，也不替代权威数据。
    try {
      const trace = window.__timelogBootTrace;
      const setSnapshotState = state => {
        if (!trace) return;
        trace.snapshot = state;
        trace.snapshotStates.push(state);
      };
      const snapshot = JSON.parse(sessionStorage.getItem('timelog.bootSnapshot.v1'));
      if (!snapshot || typeof snapshot.appHtml !== 'string') {
        setSnapshotState('no-snapshot');
        return;
      }
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      if (snapshot.dataRaw !== localStorage.getItem('timelog.v1')
        || snapshot.configRaw !== localStorage.getItem('timelog.config')) {
        setSnapshotState('rejected:data');
        return;
      }
      if (snapshot.today !== today) {
        setSnapshotState('rejected:date');
        return;
      }
      // SPEC-013：locale 门。没有它，切语言后刷新会把上一语言的整块 DOM 接回来
      // （数据/日期/视图都没变，其它门全部放行），肉眼看到的是「切了但没切」。
      if ((snapshot.locale || 'zh') !== (window.__timelogLocale || 'zh')) {
        setSnapshotState('rejected:locale');
        return;
      }
      if (snapshot.view !== localStorage.getItem('timelog.view')
        || snapshot.selectedDate !== localStorage.getItem('timelog.selectedDate')
        || snapshot.recordMode !== localStorage.getItem('timelog.recordMode')) {
        setSnapshotState('rejected:state');
        return;
      }
      const app = document.querySelector('.app');
      const addBtn = document.getElementById('add-btn');
      const listFade = document.getElementById('list-fade');
      if (!app || !addBtn) return;
      app.innerHTML = snapshot.appHtml;
      if (typeof snapshot.addHtml === 'string') addBtn.innerHTML = snapshot.addHtml;
      addBtn.hidden = Boolean(snapshot.addHidden);
      if (snapshot.addAria) addBtn.setAttribute('aria-label', snapshot.addAria);
      if (listFade) listFade.hidden = Boolean(snapshot.fadeHidden);
      document.body.classList.add('boot-restored');
      window.__timelogBootRestored = true;
      setSnapshotState('dom-restored');
    } catch {
      if (window.__timelogBootTrace) {
        window.__timelogBootTrace.snapshot = 'rejected:invalid';
        window.__timelogBootTrace.snapshotStates.push('rejected:invalid');
      }
    }
  })();
</script>

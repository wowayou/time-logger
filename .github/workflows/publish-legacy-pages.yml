# 旧 origin 只读站：只在版本 tag 或显式手动发布时部署，不随 main push 重发（D34）。
# github-pages 环境须分别保留 main 分支规则和版本 tag 规则，二者不可互相替代。
# 内容由 build_legacy_site.py 从提交树组装：运行时与 release_tag 全量比对，
# 排除开发用隐藏文件，为旧 Jekyll 文档地址生成无脚本兼容页；不改变运行时字节。
# 两个 workflow 的 tag glob 必须同步修改；它们独立执行，不是原子发布。
name: publish-legacy-pages

on:
  push:
    tags:
      - 'v[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已存在的版本 tag；所选提交的运行时必须与它完全一致（如 v1.6.1）'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release guard and assembly
        run: python3 -m unittest discover -s tests -p 'test_build_legacy_site.py'

      - name: Verify release and assemble artifact
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: python3 scripts/build_legacy_site.py --release-tag="$RELEASE_TAG" --out "$RUNNER_TEMP/legacy-site"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/legacy-site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
